name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/wheels.yml

  editable:
    if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
    name: Editable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editable package and test dependencies
        run: python -m pip install -e . pytest pytest-cov pytest-timeout pytest-xdist
      - name: Test editable installation outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests" --import-mode=importlib -n 2 --timeout=120 --cov=ssapy --cov-report=xml:"${{ github.workspace }}/coverage.xml" --durations=10
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          python -m pip install -e '.[docs]' -r docs/requirements.txt
      - name: Build documentation
        run: |
          mkdir -p docs/source/modules docs/source/_templates
          sphinx-autogen docs/source/api.rst -t docs/source/_templates -o docs/source/modules
          sphinx-build -b html docs/source docs/_build/html
          touch docs/_build/html/.nojekyll
      - name: Deploy documentation
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/_build/html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pass:
    needs: [test, editable, docs]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All jobs passed"
