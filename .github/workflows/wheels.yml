name: Build and test wheels

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install build 'cibuildwheel>=4,<5'
      - name: Build source distribution
        run: python -m build --sdist
      - name: Build, repair, and test wheels from the source distribution
        # cibuildwheel selects the compiler/interpreter, repairs native
        # dependencies, and runs the full suite in an isolated environment.
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'cibuildwheel', glob.glob('dist/*.tar.gz')[0], '--output-dir', 'wheelhouse'])"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
