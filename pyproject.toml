[project]
name = "llnl-ssapy"
version = "1.1.12"
authors = [
    { name = "LLNL SSAPy Software Team", email = "yeagerastro@gmail.com" },
]
description = "A flexible, physics-based orbital modeling and analysis tool for orbits spanning from low-Earth orbit into the cislunar regime."
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyerfa",
    "emcee",
    "lmfit",
    "sgp4",
    "ipython_genutils",
    "jplephem",
    "tqdm",
    # Ephemerides, gravity models, and textures. Required so that a plain
    # `pip install llnl-ssapy` can propagate; pins match ssatk's.
    "ssa-data-core==0.0.1",
    "ssa-data-gravity==0.0.1",
    "ssa-data-lunar==0.0.1",
    "ssa-data-lunar-gravity==0.0.1",
]

[project.optional-dependencies]
# Kept so `llnl-ssapy[data]` still resolves; the same packages are required.
data = [
    "ssa-data-core==0.0.1",
    "ssa-data-gravity==0.0.1",
    "ssa-data-lunar==0.0.1",
    "ssa-data-lunar-gravity==0.0.1",
]

all-data = [
    "ssa-data-core==0.0.1",
    "ssa-data-gravity==0.0.1",
    "ssa-data-lunar==0.0.1",
    "ssa-data-lunar-gravity==0.0.1",
    "ssa-data-propulsion==0.0.1",
    "ssa-data-benchmarks==0.0.1",
]

dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "flake8",
    "build",
    "cibuildwheel",
]

docs = [
    "sphinx==7.1.2",
    "sphinx-copybutton",
    "myst-parser<4.0.0",
    "sphinx-tabs",
    "sphinx-automodapi",
    "sphinx_rtd_theme",
    "sphinxcontrib-bibtex",
    "sphinx-autobuild",
    "docutils<0.21",
    "nbsphinx",
    "graphviz",
]

[project.urls]
Homepage = "https://github.com/LLNL/SSAPy"
Issues = "https://github.com/LLNL/SSAPy/issues"
Documentation = "https://software.llnl.gov/SSAPy/"

[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["ssapy"]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = "*-musllinux*"
archs = ["auto64"]
test-requires = ["pytest", "pytest-timeout", "pytest-xdist"]
test-sources = ["tests"]
test-command = "python -m pytest tests -n 2 --timeout=120 --durations=10"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
