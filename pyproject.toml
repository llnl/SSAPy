[project]
name = "llnl-ssapy"
version = "1.1.10"
authors = [
    { name = "LLNL SSAPy Software Team", email = "yeagerastro@gmail.com" },
]
description = "A flexible, physics-based orbital modeling and analysis tool for orbits spanning from low-Earth orbit into the cislunar regime."
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyerfa",
    "emcee",
    "lmfit",
    "sgp4",
    "ipython_genutils",
    "jplephem",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "flake8",
    "build",
    "cibuildwheel",
    "delocate",
]

docs = [
    "sphinx==7.1.2",
    "sphinx-copybutton",
    "myst-parser<4.0.0",
    "sphinx-tabs",
    "sphinx-automodapi",
    "sphinx_rtd_theme",
    "sphinxcontrib-bibtex",
    "sphinx-autobuild",
    "docutils<0.21",
    "nbsphinx",
    "graphviz",
]

[project.urls]
Homepage = "https://github.com/LLNL/SSAPy"
Issues = "https://github.com/LLNL/SSAPy/issues"
Documentation = "https://software.llnl.gov/SSAPy/"

[build-system]
requires = ["setuptools>=77", "wheel", "scikit-build", "cmake"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["ssapy", "ssapy.*"], namespaces = true } }
include-package-data = true

[tool.setuptools.package-data]
ssapy = ["*.cpp", "*.h", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
