[project]
name = "llnl-ssapy"
version = "1.1.5"
authors = [
    { name = "LLNL SSAPy Software Team", email = "yeagerastro@gmail.com" },
]
description = "A fast, flexible, high-fidelity orbital modeling and analysis tool for orbits spanning from low-Earth orbit into the cislunar regime."
readme = "README.rst"
requires-python = ">=3.8"
license = { file = "LICENSE" }

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyerfa",
    "emcee",
    "lmfit",
    "sgp4",
    "ipython_genutils",
    "ipyvolume",
    "jplephem",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "cibuildwheel",
    "delocate",
]

docs = [
    "myst-parser",
    "graphviz",
]

[project.urls]
Homepage = "https://github.com/LLNL/SSAPy"
Issues = "https://github.com/LLNL/SSAPy/issues"
Documentation = "https://software.llnl.gov/SSAPy/"

[build-system]
requires = ["setuptools>=42", "wheel", "scikit-build", "cmake"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ssapy"]
include-package-data = true

[tool.setuptools.package-data]
ssapy = ["*.cpp", "*.h", "data/*", "*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
